name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish to this release tag, e.g. v0.2.0 (leave empty to only build)"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri-macos:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"

    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # The bundler stamps the .dmg filename from tauri.conf.json, and the
      # Homebrew cask builds its download URL from the tag, so a tag that
      # disagrees with the version would publish a cask pointing at nothing.
      - name: Resolve the version and tag
        id: meta
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG tauri.conf.json=$VERSION package.json=$PKG"

          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::tauri.conf.json is at $VERSION but package.json is at $PKG. Run 'node scripts/sync-versions.cjs'."
            exit 1
          fi

          if [ -n "$TAG" ] && [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match version $VERSION."
            echo "Run 'npm version ${TAG#v}' on main, push the commit, then tag it."
            exit 1
          fi

          # A tag like v0.2.0-beta.1 still gets a release, but must not reach
          # the tap: the cask carries a single version, and a prerelease there
          # would be handed to everyone running `brew upgrade`.
          PRERELEASE=false
          case "$TAG" in *-*) PRERELEASE=true ;; esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify Certificate
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # install the explicit rust target(s) for this job (comma separated if needed)
          targets: ${{ matrix.rust_target }}

      - name: Ensure rustup target is added (explicit)
        run: |
          rustup target add ${{ matrix.rust_target }} || true

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Note about Windows ARM toolchain
        if: startsWith(matrix.rust_target, 'aarch64-pc-windows')
        run: |
          echo "Note: Building Windows ARM (aarch64-pc-windows-msvc) on GitHub hosted x86 runners may require Visual Studio ARM toolchain/linker support."
          echo "If you encounter linker errors, consider using a self-hosted Windows ARM64 runner or provisioning the Visual Studio components for ARM64."

      # With an empty tagName this only builds; with a tag it also creates the
      # release and attaches LinkLane_<version>_aarch64.dmg, which is the file
      # the cask downloads.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "LinkLane v${{ steps.meta.outputs.version }}"
          releaseBody: "Download the `.dmg` below, or install with `brew install --cask estruyf/tap/linklane`. See the [changelog](https://github.com/estruyf/LinkLane/blob/main/CHANGELOG.md) for what changed."
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-${{ matrix.platform }}-${{ matrix.rust_target }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error

      # What makes `brew install --cask estruyf/tap/linklane` resolve. It hashes
      # the .dmg the build just produced, so it cannot race the release CDN.
      - name: Update the Homebrew tap
        if: steps.meta.outputs.tag != '' && steps.meta.outputs.prerelease == 'false'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the tap still serves the previous version. Run homebrew/publish-cask.sh --push by hand."
            exit 0
          fi
          ./homebrew/publish-cask.sh --push
